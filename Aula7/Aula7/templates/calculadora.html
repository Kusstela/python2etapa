<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Web — Flask</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <h1>Calculadora Web</h1>

  <div id="calculator">

    <!-- method="POST" envia os dados para o Flask; a função calcular() faz a conta -->
    <form method="POST" action="{{ url_for('index') }}">

      <!-- Primeiro número -->
      <div class="form-grupo">
        <label for="num1">Primeiro número</label>
        <input type="number" id="num1" name="num1" step="any" required
               value="{{ request.form.get('num1', '') }}">
      </div>

      <!-- Seleção de operação -->
      <div class="form-grupo">
        <label for="operacao">Operação</label>
        {% set op = request.form.get('operacao', '+') %}
        <select id="operacao" name="operacao" required onchange="atualizarNum2()">
          <option value="+"   {% if op == '+'    %}selected{% endif %}>+ Adição</option>
          <option value="-"   {% if op == '-'    %}selected{% endif %}>− Subtração</option>
          <option value="*"   {% if op == '*'    %}selected{% endif %}>× Multiplicação</option>
          <option value="/"   {% if op == '/'    %}selected{% endif %}>÷ Divisão</option>
          <option value="**"  {% if op == '**'   %}selected{% endif %}>^ Potência</option>
          <option value="sqrt"{% if op == 'sqrt' %}selected{% endif %}>√ Raiz quadrada</option>
          <option value="log" {% if op == 'log'  %}selected{% endif %}>log Logaritmo (base 10)</option>
        </select>
      </div>

      <!-- Segundo número (oculto para sqrt e log) -->
      <div class="form-grupo" id="grupo-num2">
        <label for="num2">Segundo número</label>
        <input type="number" id="num2" name="num2" step="any"
               value="{{ request.form.get('num2', '') }}">
      </div>

      <button type="submit">Calcular</button>
    </form>

    <!-- Resultado enviado pelo Python via Jinja2 -->
    {% if etapas %}
    <div class="resultado">
      <strong>Resposta do servidor (Python):</strong>
      <div class="etapas">{{ etapas }}</div>
      <div class="valor">Resultado: <span>{{ resultados }}</span></div>
    </div>
    {% endif %}

    <a href="{{ url_for('index') }}">🔄 Limpar / nova conta</a>

  </div><!-- /#calculator -->

  <script>
    // Oculta o campo num2 quando a operação não precisa dele (sqrt, log)
    function atualizarNum2() {
      const op    = document.getElementById("operacao").value;
      const unary = ["sqrt", "log"];           // operações que usam só num1
      const grupo = document.getElementById("grupo-num2");
      const num2  = document.getElementById("num2");

      const esconder = unary.includes(op);
      grupo.style.display = esconder ? "none" : "block";
      num2.required       = !esconder;
      if (esconder) num2.value = "";
    }

    // Executa ao carregar para respeitar a operação já selecionada (pós-POST)
    atualizarNum2();
  </script>

</body>
</html>
